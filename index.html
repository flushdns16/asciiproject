<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video Encoder & Terminal Streamer</title>
    <style>
        body {
            background-color: #0d0208;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            border: 1px solid #00ff66;
            padding: 30px;
            background-color: #121212;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            border-radius: 8px;
            width: 450px;
            text-align: center;
        }
        h2 {
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }
        input, button {
            background-color: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
        }
        button:hover {
            background-color: #00ff66;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #ff0055;
        }
        .success {
            color: #00ff66 !important;
        }
        #ascii-preview {
            font-size: 4px;
            line-height: 4px;
            white-space: pre;
            background: #000;
            padding: 10px;
            margin-top: 15px;
            max-height: 180px;
            overflow: hidden;
            border: 1px dashed #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ASCII TERMINAL STREAM</h2>
        <p style="font-size: 12px; color: #888;">Yüksek kaliteli net mod aktif.</p>
        
        <input type="file" id="videoFile" accept="video/*">
        <input type="text" id="customPath" placeholder="Örn: mytm1 (Sadece harf/rakam)">
        
        <button onclick="processVideo()" id="processBtn">SİSTEME ENJEKTE ET</button>
        
        <div id="status"></div>
        <div id="ascii-preview"></div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const pathInput = document.getElementById('customPath').value.trim();
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('ascii-preview');
            const btn = document.getElementById('processBtn');

            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Lütfen bir video seçin!";
                return;
            }

            if (!pathInput || !/^[a-zA-Z0-9]+$/.test(pathInput)) {
                statusDiv.innerText = "Hata: Yol sadece harf ve rakamlardan oluşmalıdır!";
                return;
            }

            btn.disabled = true;
            statusDiv.className = "";
            statusDiv.innerText = "Video yükleniyor...";

            const file = fileInput.files[0];
            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.muted = true;
            video.playsInline = true;

            try {
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => resolve();
                    video.onerror = () => reject(new Error("Video yüklenemedi."));
                });

                const duration = video.duration;
                const fps = 10; // Daha akıcı FPS
                const totalFrames = Math.min(Math.floor(duration * fps), 400);
                const frames = [];

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                
                // Netlik için artırılmış çözünürlük
                const cols = 100;
                const rows = 50;
                canvas.width = cols;
                canvas.height = rows;

                // O ilk net ve detaylı ton ölçeği
                const asciiChars = "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ";

                for (let i = 0; i < totalFrames; i++) {
                    statusDiv.innerText = `Kareler işleniyor: ${i + 1} / ${totalFrames}`;
                    video.currentTime = i / fps;
                    
                    await new Promise(resolve => {
                        const handler = () => {
                            video.removeEventListener('seeked', handler);
                            resolve();
                        };
                        video.addEventListener('seeked', handler);
                        setTimeout(resolve, 300);
                    });

                    ctx.drawImage(video, 0, 0, cols, rows);
                    const imgData = ctx.getImageData(0, 0, cols, rows).data;
                    
                    let asciiImage = "";
                    for (let y = 0; y < rows; y++) {
                        for (let x = 0; x < cols; x++) {
                            const offset = (y * cols + x) * 4;
                            const r = imgData[offset];
                            const g = imgData[offset + 1];
                            const b = imgData[offset + 2];
                            const avg = (r * 0.299 + g * 0.587 + b * 0.114); // Gerçekçi parlaklık formülü
                            const charIndex = Math.floor((avg / 255) * (asciiChars.length - 1));
                            asciiImage += asciiChars[charIndex];
                        }
                        asciiImage += "\n";
                    }
                    frames.push(asciiImage);
                    previewDiv.innerText = asciiImage;
                }

                statusDiv.innerText = "Sunucuya kaydediliyor...";

                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: pathInput,
                        fps: fps,
                        frames: frames
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Kayıt hatası.");
                }

                statusDiv.className = "success";
                statusDiv.innerHTML = `Başarılı! Terminalden çağır:<br><b>curl https://${window.location.host}/${pathInput}</b>`;
            } catch (error) {
                statusDiv.className = "";
                statusDiv.innerText = "Hata: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

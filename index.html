<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video Terminal Streamer</title>
    <style>
        body {
            background-color: #030303;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-panel {
            width: 100%;
            max-width: 900px;
            background-color: #0d0208;
            border: 1px solid #00ff66;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0 0 10px 0;
            width: 100%;
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
            font-size: 20px;
            letter-spacing: 1px;
        }
        input[type="file"], input[type="text"] {
            background-color: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
            flex: 1;
            min-width: 200px;
        }
        button {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #00cc52;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }
        #status {
            width: 100%;
            font-size: 14px;
            color: #ff0055;
            margin-top: 5px;
        }
        .success {
            color: #00ff66 !important;
            font-weight: bold;
            word-break: break-all;
        }
        /* Tam Sayfa Devasa ve Net Terminal Önizleme Ekranı */
        #ascii-preview {
            width: 100%;
            max-width: 1100px;
            flex: 1;
            background: #000;
            color: #00ff66;
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 7px;
            line-height: 7px;
            white-space: pre;
            overflow: auto;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            box-sizing: border-box;
            min-height: 450px;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h2>ASCII TERMINAL STREAMER // FULLSCREEN HQ</h2>
        <input type="file" id="videoFile" accept="video/*">
        <input type="text" id="customPath" placeholder="Dizin adı (Örn: mytm)">
        <button onclick="processVideo()" id="processBtn">ENJEKTE ET & OLUŞTUR</button>
        <div id="status"></div>
    </div>

    <div id="ascii-preview">Video yüklenmeyi ve işlenmeyi bekliyor... Önizleme burada tam ekran ve net bir şekilde belirecek.</div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function processVideo() {
            const fileInput = document.getElementById('videoFile');
            const pathInput = document.getElementById('customPath').value.trim();
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('ascii-preview');
            const btn = document.getElementById('processBtn');

            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Lütfen bir video dosyası seçin!";
                return;
            }

            if (!pathInput || !/^[a-zA-Z0-9]+$/.test(pathInput)) {
                statusDiv.innerText = "Hata: Dizin adı yalnızca harf ve rakamlardan oluşmalıdır!";
                return;
            }

            btn.disabled = true;
            statusDiv.className = "";
            statusDiv.innerText = "Video RAM'e alınıyor...";

            const file = fileInput.files[0];
            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.muted = true;
            video.playsInline = true;

            try {
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => resolve();
                    video.onerror = () => reject(new Error("Video yüklenemedi veya geçersiz format."));
                });

                const duration = video.duration;
                const fps = 10;
                const totalFrames = Math.min(Math.floor(duration * fps), 350);
                const frames = [];

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                
                // Tam ekran için optimize edilmiş yüksek çözünürlük
                const cols = 130;
                const rows = 65;
                canvas.width = cols;
                canvas.height = rows;

                // Genişletilmiş ve keskin kontrast tonları
                const asciiChars = "@#W$9876543210?!abc;:+-. ";

                for (let i = 0; i < totalFrames; i++) {
                    statusDiv.innerText = `Kareler işleniyor ve optimize ediliyor: ${i + 1} / ${totalFrames}`;
                    video.currentTime = i / fps;
                    
                    await new Promise(resolve => {
                        const handler = () => {
                            video.removeEventListener('seeked', handler);
                            resolve();
                        };
                        video.addEventListener('seeked', handler);
                        setTimeout(resolve, 250);
                    });

                    ctx.drawImage(video, 0, 0, cols, rows);
                    const imgData = ctx.getImageData(0, 0, cols, rows).data;
                    
                    let asciiImage = "";
                    for (let y = 0; y < rows; y++) {
                        for (let x = 0; x < cols; x++) {
                            const offset = (y * cols + x) * 4;
                            const r = imgData[offset];
                            const g = imgData[offset + 1];
                            const b = imgData[offset + 2];
                            const avg = (r * 0.299 + g * 0.587 + b * 0.114);
                            const charIndex = Math.floor((avg / 255) * (asciiChars.length - 1));
                            asciiImage += asciiChars[charIndex];
                        }
                        asciiImage += "\n";
                    }
                    frames.push(asciiImage);
                    previewDiv.innerText = asciiImage; // Canlı dev ekran önizleme
                }

                statusDiv.innerText = "Sunucuya aktarılıyor...";

                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: pathInput,
                        fps: fps,
                        frames: frames
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Sunucu kayıt başarısız.");
                }

                statusDiv.className = "success";
                statusDiv.innerHTML = `Başarılı! Terminalde oynatmak için:<br><b>curl https://${window.location.host}/${pathInput}</b>`;
            } catch (error) {
                statusDiv.className = "";
                statusDiv.innerText = "Hata: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
